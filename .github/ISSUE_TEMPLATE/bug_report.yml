name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trantor version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [PowerShell 7, Windows PowerShell, Command Prompt, Git Bash, WSL, Other]
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Open DevTools with Ctrl+Shift+I and paste any errors from the Console tab.
      render: text
