name: Diag shell integration
on:
  push:
    branches: [diag-shell]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm i --no-save @xterm/headless@5
      - run: node diag/probe.js
      - name: App probe
        run: |
          npx electron diag/app-probe.js
        timeout-minutes: 5
        env:
          ELECTRON_ENABLE_LOGGING: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ matrix.os }}
          path: diag/out
