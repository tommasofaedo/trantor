name: Diag shell integration
on:
  push:
    branches: [diag-shell]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm i --no-save --ignore-scripts @xterm/headless@5
      - run: node diag/probe.js
